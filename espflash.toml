[espflash]
# 注释：原来的 flash_mode 被注释掉，因为 esp32s3 在 espflash 3.2.0 下有 bug
# flash_mode = "qio"
flash_size = "8MB"
flash_frequency = "80MHz"

# ⚠️ 这是关键：必须在 [espflash] 段内指定自定义分区表
partition_table = "partitions.csv"

# 下面的 [espflash.idf_format_args] 对 espflash 无效，可以保留（无害）或删除
[espflash.idf_format_args]
partition_table = "partitions.csv"
bootloader = "esp32s3-qio-bootloader-fast.bin"
