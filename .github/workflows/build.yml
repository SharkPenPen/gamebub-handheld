name: Build ESP Firmware

on:
  push:
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: firmware/handheld

jobs:
  build:
    name: Build firmware for ESP32-S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/handheld

      - name: Setup Rust toolchain for ESP32-S3
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true

      - name: Build release binary
        run: cargo build --release --features rev2

      - name: Install espflash
        run: cargo install espflash --locked

      - name: Generate flashable firmware image
        run: |
          # 自动查找项目中唯一的 ELF 文件
          ELF_FILE=$(ls target/xtensa-esp32s3-none-elf/release/*.elf | head -n 1)
          if [ -z "$ELF_FILE" ]; then
            echo "Error: No ELF file found in target/xtensa-esp32s3-none-elf/release/"
            exit 1
          fi
          echo "Using ELF: $ELF_FILE"
          espflash save-image \
            --config espflash.toml \
            --chip esp32s3 \
            --merge firmware.bin \
            "$ELF_FILE"

      - name: Upload firmware to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gamebub-handheld-firmware
          path: firmware/handheld/firmware.bin
