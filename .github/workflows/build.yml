name: Build ESP Firmware

on:
  push:
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:
  # pull_request:

env:
  CARGO_TERM_COLOR: always

# ✅ 保留原工作目录，让 Cargo 能正确读取 .cargo/config.toml（含目标平台）
defaults:
  run:
    working-directory: firmware/handheld

jobs:
  build:
    name: Build firmware for ESP32-S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/handheld -> target

      - name: Setup Rust toolchain for ESP32-S3
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true

      - name: Build release binary
        run: cargo build --release --features rev2

      - name: Install cargo-espflash
        run: cargo install cargo-espflash --locked

      - name: Generate flashable firmware image
        # ⚠️ 关键修复：使用绝对路径引用根目录下的配置文件和分区表
        run: |
          cargo espflash save-image \
            --release \
            --features rev2 \
            --chip esp32s3 \
            --config ${{ github.workspace }}/espflash.toml \
            --partition-table ${{ github.workspace }}/partitions.csv \
            --merge firmware.bin

      - name: Upload firmware to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gamebub-handheld-firmware
          path: firmware/handheld/firmware.bin
