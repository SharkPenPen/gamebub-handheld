name: Build ESP Firmware

on:
  push:
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:
  # pull_request:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: firmware/handheld   # ✅ 保持原样，cargo 能自动读取 .cargo/config.toml

jobs:
  build:
    name: Build firmware for ESP32-S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/handheld -> target

      - name: Setup Rust toolchain for ESP32-S3
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true

      - name: Build release binary
        run: cargo build --release --features rev2

      - name: Install cargo-espflash
        run: cargo install cargo-espflash --locked

      - name: Generate flashable firmware image
        # ⚠️ 唯一改动：把 --config 和 --partition-table 放到 save-image 前面（必须这样）
        run: |
          cargo espflash --config espflash.toml save-image \
            --release \
            --features rev2 \
            --chip esp32s3 \
            --partition-table partitions.csv \
            --merge firmware.bin

      - name: Upload firmware to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gamebub-handheld-firmware
          path: firmware/handheld/firmware.bin
