name: Build ESP Firmware

on:
  push:
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:
  # pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build firmware for ESP32-S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/handheld -> target

      - name: Setup Rust toolchain for ESP32-S3
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true

      - name: Build release binary
        run: cargo build --release --features rev2 --manifest-path firmware/handheld/Cargo.toml

      - name: Install cargo-espflash
        run: cargo install cargo-espflash --locked

      - name: Generate flashable firmware image
        run: |
          cargo espflash --config espflash.toml save-image \
            --release \
            --features rev2 \
            --chip esp32s3 \
            --manifest-path firmware/handheld/Cargo.toml \
            --merge firmware/handheld/firmware.bin

      - name: Upload firmware to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gamebub-handheld-firmware
          path: firmware/handheld/firmware.bin
