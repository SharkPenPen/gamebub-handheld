name: Build ESP Firmware

on:
  push:
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: firmware/handheld

jobs:
  build:
    name: Build firmware for ESP32-S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/handheld

      - name: Setup Rust toolchain for ESP32-S3
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true

      - name: Install cargo-espflash
        run: cargo install cargo-espflash --locked

      # 删除格式错误的配置文件，避免干扰（如果不需要保留）
      - name: Remove incompatible espflash.toml
        run: rm -f espflash.toml

      - name: Build and generate firmware image
        run: |
          cargo espflash save-image \
            --release \
            --features rev2 \
            --chip esp32s3 \
            --flash-size 8mb \
            --flash-freq 80MHz \
            --bootloader esp32s3-qio-bootloader-fast.bin \
            --partition-table partitions.csv \
            --merge firmware.bin

      - name: Upload firmware to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gamebub-handheld-firmware
          path: firmware/handheld/firmware.bin
